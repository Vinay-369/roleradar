services:
  mongo:
    image: mongo:7
    container_name: roleradar-mongo
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - roleradar_mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  roleradar_mongo_data:
