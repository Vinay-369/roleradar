<title>API Compensation Diagnostic</title>
<style>
:root {
  --bg: #ffffff;
  --surface: #f8f9fa;
  --border: #e1e4e8;
  --text: #24292e;
  --text-muted: #6a737d;
  --success: #28a745;
  --warning: #ffc107;
  --error: #dc3545;
  --code-bg: #f6f8fa;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --text-muted: #8b949e;
    --code-bg: #161b22;
  }
}

:root[data-theme="dark"] {
  --bg: #0d1117;
  --surface: #161b22;
  --border: #30363d;
  --text: #c9d1d9;
  --text-muted: #8b949e;
  --code-bg: #161b22;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: var(--bg);
  color: var(--text);
  padding: 24px;
  line-height: 1.6;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
}

h1 {
  font-size: 28px;
  margin-bottom: 8px;
}

.subtitle {
  color: var(--text-muted);
  margin-bottom: 24px;
}

.controls {
  display: flex;
  gap: 12px;
  margin-bottom: 24px;
  align-items: center;
}

button {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 8px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
}

button:hover {
  background: var(--border);
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.status {
  padding: 12px 16px;
  border-radius: 6px;
  margin-bottom: 24px;
  border-left: 4px solid;
}

.status.success {
  background: rgba(40, 167, 69, 0.1);
  border-color: var(--success);
}

.status.error {
  background: rgba(220, 53, 69, 0.1);
  border-color: var(--error);
}

.status.warning {
  background: rgba(255, 193, 7, 0.1);
  border-color: var(--warning);
}

.job-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 16px;
}

.job-header {
  display: flex;
  justify-content: space-between;
  align-items: start;
  margin-bottom: 12px;
}

.job-title {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 4px;
}

.job-company {
  color: var(--text-muted);
  font-size: 14px;
}

.badge {
  display: inline-block;
  padding: 4px 8px;
  border-radius: 4px;
  font-size: 12px;
  font-weight: 500;
}

.badge.success {
  background: var(--success);
  color: white;
}

.badge.error {
  background: var(--error);
  color: white;
}

.badge.warning {
  background: var(--warning);
  color: black;
}

.fields-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 12px;
  margin-top: 12px;
}

.field {
  font-family: 'Courier New', monospace;
  font-size: 13px;
  padding: 8px;
  background: var(--code-bg);
  border-radius: 4px;
}

.field-name {
  color: var(--text-muted);
  font-weight: 600;
}

.field-value {
  color: var(--text);
  margin-top: 4px;
}

.field-value.null {
  color: var(--text-muted);
  font-style: italic;
}

.summary {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}

.summary-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  text-align: center;
}

.summary-value {
  font-size: 32px;
  font-weight: 700;
  margin-bottom: 4px;
}

.summary-label {
  color: var(--text-muted);
  font-size: 14px;
}

code {
  font-family: 'Courier New', monospace;
  background: var(--code-bg);
  padding: 2px 6px;
  border-radius: 3px;
  font-size: 13px;
}
</style>

<div class="container">
  <h1>API Compensation Diagnostic</h1>
  <p class="subtitle">Checking what the backend API actually returns for job compensation fields</p>

  <div class="controls">
    <button id="checkBtn" onclick="checkAPI()">Check API Response</button>
    <button onclick="checkDatabase()">Check Database</button>
    <span id="loading" style="display: none; color: var(--text-muted);">Loading...</span>
  </div>

  <div id="status"></div>
  <div id="summary"></div>
  <div id="results"></div>
</div>

<script>
const API_BASE = 'http://localhost:8000/api';

function showStatus(message, type = 'success') {
  const statusDiv = document.getElementById('status');
  statusDiv.innerHTML = `<div class="status ${type}">${message}</div>`;
}

function showSummary(data) {
  const total = data.length;
  const withSalary = data.filter(j => j.salary_min || j.salary_max).length;
  const withStipend = data.filter(j => j.stipend_min || j.stipend).length;
  const withCompText = data.filter(j => j.compensation_text).length;
  const withAny = data.filter(j => j.salary_min || j.stipend_min || j.compensation_text).length;

  document.getElementById('summary').innerHTML = `
    <div class="summary">
      <div class="summary-card">
        <div class="summary-value">${total}</div>
        <div class="summary-label">Total Jobs</div>
      </div>
      <div class="summary-card">
        <div class="summary-value">${withSalary}</div>
        <div class="summary-label">With Salary</div>
      </div>
      <div class="summary-card">
        <div class="summary-value">${withStipend}</div>
        <div class="summary-label">With Stipend</div>
      </div>
      <div class="summary-card">
        <div class="summary-value">${withCompText}</div>
        <div class="summary-label">With Comp Text</div>
      </div>
      <div class="summary-card">
        <div class="summary-value">${withAny}</div>
        <div class="summary-label">With Any Compensation</div>
      </div>
    </div>
  `;
}

function renderJob(job) {
  const hasCompensation = job.salary_min || job.salary_max || job.stipend_min || job.stipend || job.compensation_text;
  const badgeClass = hasCompensation ? 'success' : 'error';
  const badgeText = hasCompensation ? 'HAS COMPENSATION' : 'NO COMPENSATION';

  return `
    <div class="job-card">
      <div class="job-header">
        <div>
          <div class="job-title">${job.title}</div>
          <div class="job-company">${job.company}</div>
        </div>
        <span class="badge ${badgeClass}">${badgeText}</span>
      </div>
      <div class="fields-grid">
        <div class="field">
          <div class="field-name">salary_min</div>
          <div class="field-value ${job.salary_min ? '' : 'null'}">${job.salary_min ?? 'null'}</div>
        </div>
        <div class="field">
          <div class="field-name">salary_max</div>
          <div class="field-value ${job.salary_max ? '' : 'null'}">${job.salary_max ?? 'null'}</div>
        </div>
        <div class="field">
          <div class="field-name">stipend_min</div>
          <div class="field-value ${job.stipend_min ? '' : 'null'}">${job.stipend_min ?? 'null'}</div>
        </div>
        <div class="field">
          <div class="field-name">stipend</div>
          <div class="field-value ${job.stipend ? '' : 'null'}">${job.stipend ?? 'null'}</div>
        </div>
        <div class="field">
          <div class="field-name">compensation_text</div>
          <div class="field-value ${job.compensation_text ? '' : 'null'}">${job.compensation_text ?? 'null'}</div>
        </div>
        <div class="field">
          <div class="field-name">compensation_type</div>
          <div class="field-value ${job.compensation_type ? '' : 'null'}">${job.compensation_type ?? 'null'}</div>
        </div>
      </div>
    </div>
  `;
}

async function checkAPI() {
  const loadingEl = document.getElementById('loading');
  const checkBtn = document.getElementById('checkBtn');

  loadingEl.style.display = 'inline';
  checkBtn.disabled = true;

  try {
    // Try to get auth token from localStorage (if any)
    const token = localStorage.getItem('auth_token') || '';

    const response = await fetch(`${API_BASE}/jobs?page_size=50`, {
      headers: token ? {
        'Authorization': `Bearer ${token}`
      } : {}
    });

    if (!response.ok) {
      if (response.status === 401) {
        showStatus('⚠️ Not authenticated. The API returned 401 Unauthorized. You may need to log in to the frontend first.', 'warning');
        return;
      }
      throw new Error(`HTTP ${response.status}: ${response.statusText}`);
    }

    const jobs = await response.json();

    showStatus(`✓ Successfully fetched ${jobs.length} jobs from API`, 'success');
    showSummary(jobs);

    // Show first 10 jobs with details
    const resultsHTML = jobs.slice(0, 10).map(renderJob).join('');
    document.getElementById('results').innerHTML = `
      <h2 style="margin: 24px 0 16px; font-size: 20px;">First 10 Jobs (API Response)</h2>
      ${resultsHTML}
    `;

  } catch (error) {
    showStatus(`✗ Error: ${error.message}<br><br>Make sure your backend is running on <code>localhost:8000</code>`, 'error');
    console.error(error);
  } finally {
    loadingEl.style.display = 'none';
    checkBtn.disabled = false;
  }
}

async function checkDatabase() {
  showStatus('Database check requires backend access. Use the backfill script to see database stats.', 'warning');
}

// Auto-run on load
window.addEventListener('load', () => {
  checkAPI();
});
</script>
